<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify — Utkarsh</title><style>*{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font-family:Inter,system-ui}.top{height:64px;background:#090909;display:flex;align-items:center;padding:0 5%;gap:18px;position:sticky;top:0;z-index:5}.logo{color:#1ed760;font-size:26px;font-weight:900}.top small{color:#999}.top a{margin-left:auto;color:#ddd;text-decoration:none}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{background:#090909;padding:28px 20px}aside h3{font-size:11px;color:#888;letter-spacing:.1em}aside button{display:block;width:100%;padding:10px 8px;background:none;color:#bbb;border:0;text-align:left;cursor:pointer;border-radius:5px}aside button:hover,aside button.active{background:#222;color:#fff}.main{padding:35px 5vw 100px;background:linear-gradient(#202020,#121212 350px)}.hero{display:flex;align-items:end;gap:25px;padding-bottom:35px}.cover{width:180px;height:180px;background:linear-gradient(135deg,#1ed760,#083d21);display:grid;place-items:center;font-size:58px;font-weight:900;box-shadow:0 15px 50px #0008}.hero h1{font-size:42px;margin:5px 0}.hero p{color:#aaa}.tracks{margin-top:20px}.track{display:grid;grid-template-columns:40px 1fr 100px 40px;gap:12px;align-items:center;padding:11px 8px;border-radius:5px;cursor:pointer}.track:hover{background:#ffffff12}.track small{color:#aaa}.now{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #333;padding:12px 5%;display:flex;align-items:center;gap:15px}.bar{flex:1;height:4px;background:#555;border-radius:5px}.fill{width:38%;height:100%;background:#1ed760}.play{background:#1ed760;border:0;border-radius:50%;width:38px;height:38px}.eq{display:flex;gap:3px;align-items:end;height:30px}.eq i{display:block;width:3px;background:#1ed760;animation:b 1s infinite alternate}.eq i:nth-child(2){height:22px;animation-delay:.2s}.eq i:nth-child(3){height:12px;animation-delay:.4s}.eq i:nth-child(4){height:26px;animation-delay:.1s}@keyframes b{to{height:5px}}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:none}.hero{align-items:flex-start}.cover{width:120px;height:120px}.hero h1{font-size:28px}}</style></head><body><header class="top"><span class="logo">●</span><b>Spotify</b><small>portfolio soundtrack</small><a href="index.html">← Portfolio</a></header><main class="layout"><aside><h3>YOUR LIBRARY</h3><button class="active">Portfolio FM</button><button>Quant Mode</button><button>Paris Nights</button><button>F1 × Focus</button><h3>PLAYLISTS</h3><button>Build Mode</button><button>Mathematics</button><button>Late Night Coding</button></aside><section class="main"><div class="hero"><div class="cover">UM</div><div><small>PLAYLIST</small><h1>Portfolio FM</h1><p>The soundtrack to building things, solving things and occasionally overthinking things.</p><b>Utkarsh Mangal · 18 tracks</b></div></div><div class="tracks" id="tracks"></div></section></main><div class="now"><div><b id="song">Choose a track</b><small id="artist">Portfolio FM</small></div><button class="play" onclick="toggle()" id="play">▶</button><div class="bar"><div class="fill" id="fill"></div></div><div class="eq"><i style="height:15px"></i><i></i><i></i><i></i></div></div><script>const songs=[['01','Numbers','Math / AI'],['02','Night Drive','F1 / Focus'],['03','Optimization','Deep Work'],['04','Paris at 05:00','Exchange'],['05','Ship It','Build Mode'],['06','Quant Signals','Markets'],['07','Euler’s Quest','Math Club'],['08','The Algorithm','Research']];const box=document.querySelector('#tracks');box.innerHTML=songs.map((s,i)=>`<div class="track" onclick="playSong(${i})"><span>${s[0]}</span><div><b>${s[1]}</b><small>${s[2]}</small></div><small>${2+i}:0${i}</small><span>♡</span></div>`).join('');let timer,playing=false,currentSong=0;function playSong(i){currentSong=i;document.querySelector('#song').textContent=songs[i][1];document.querySelector('#artist').textContent=songs[i][2];playing=true;document.querySelector('#play').textContent='Ⅱ';clearInterval(timer);let p=0;timer=setInterval(()=>{p=(p+2)%101;document.querySelector('#fill').style.width=p+'%'},150)}function toggle(){playing=!playing;document.querySelector('#play').textContent=playing?'Ⅱ':'▶';if(playing){playSong(currentSong)}else{clearInterval(timer)}}</script></body></html>
