<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp — Utkarsh</title><style>*{box-sizing:border-box}body{margin:0;background:#efeae2;font-family:Inter,system-ui;color:#111}.top{height:62px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 5%;gap:14px;position:sticky;top:0;z-index:5}.top b{font-size:17px}.top small{opacity:.7}.top a{margin-left:auto;color:#fff;text-decoration:none}.app{max-width:1100px;height:calc(100vh - 62px);margin:auto;display:grid;grid-template-columns:360px 1fr;background:#f0f2f5}.list{background:#fff;border-right:1px solid #ddd}.listhead{padding:20px;display:flex;justify-content:space-between}.search{margin:0 12px 10px;padding:10px 14px;background:#f0f2f5;border:0;border-radius:9px;width:calc(100% - 24px)}.chat{display:flex;gap:12px;padding:13px 16px;border-top:1px solid #eee;cursor:pointer}.chat.active{background:#f0f2f5}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#128c7e;color:#fff;font-weight:800;flex:none}.chat p{margin:5px 0 0;color:#667781;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat time{margin-left:auto;color:#8696a0;font-size:10px}.window{display:flex;flex-direction:column;background:#efeae2}.head{background:#f0f2f5;padding:12px 18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd}.head small{display:block;color:#667781;margin-top:3px}.messages{flex:1;padding:25px;overflow:auto;background:radial-gradient(#ffffff55 1px,transparent 1px);background-size:20px 20px}.bubble{max-width:65%;background:#fff;padding:10px 12px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px #0001;font-size:13px}.me{margin-left:auto;background:#d9fdd3}.composer{display:flex;gap:10px;padding:12px;background:#f0f2f5}.composer input{flex:1;border:0;border-radius:20px;padding:12px}.composer button{border:0;border-radius:50%;width:42px;background:#128c7e;color:#fff}.typing{color:#128c7e;font-size:11px;display:none}.typing.show{display:block}@media(max-width:720px){.app{grid-template-columns:1fr}.list{display:none}.bubble{max-width:85%}}</style></head><body><header class="top"><b>WhatsApp</b><small>portfolio / direct</small><a href="index.html">← Portfolio</a></header><main class="app"><aside class="list"><div class="listhead"><b>Chats</b><span>⋮</span></div><input class="search" placeholder="Search chats" oninput="filter(this.value)"><div id="chats"></div></aside><section class="window"><div class="head"><div class="avatar">R</div><div><b id="person">Recruiter</b><small id="status">online · portfolio world</small></div></div><div class="messages" id="messages"><div class="bubble">Hey! I found your portfolio. What have you been building lately?</div><div class="bubble me">A portfolio that behaves like a product — with real projects behind every interface.</div><div class="bubble">Show me something real.</div><div class="bubble me"><b>UniPool</b><br>Live product → <a href="https://uni-pool-ruddy.vercel.app/" target="_blank">open build</a></div></div><div class="composer"><input id="input" placeholder="Message" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div></section></main><script>const data=[['Recruiter','Show me something real.','12:42','R'],['Math Club','Euler’s Quest planning','11:18','MC'],['CentraleSupélec','Paris / projects / exchange','09:34','CS'],['Project Lab','CVRPTW benchmark results','Mon','PL'],['Future You','ship it.','Yesterday','FY']];const chats=document.querySelector('#chats');function draw(q=''){chats.innerHTML=data.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())||x[1].toLowerCase().includes(q.toLowerCase())).map((x,i)=>`<div class="chat ${i?'':'active'}" onclick="openChat(${i})"><div class="avatar">${x[3]}</div><div><b>${x[0]}</b><p>${x[1]}</p></div><time>${x[2]}</time></div>`).join('')}function filter(v){draw(v)}function openChat(i){document.querySelector('#person').textContent=data[i][0];document.querySelector('#status').textContent=i===0?'online · portfolio world':'last seen recently';document.querySelectorAll('.chat').forEach((e,n)=>e.classList.toggle('active',n===i));if(i>0)document.querySelector('#messages').innerHTML=`<div class="bubble">${data[i][1]}</div><div class="bubble me">Let’s talk about the work — projects, mathematics, software, whatever you want to explore.</div>`}function send(){const x=document.querySelector('#input'),v=x.value.trim();if(!v)return;document.querySelector('#messages').insertAdjacentHTML('beforeend',`<div class="bubble me">${v.replace(/</g,'&lt;')}</div><div class="bubble" id="reply">typing…</div>`);x.value='';setTimeout(()=>{const r=document.querySelector('#reply');if(r){r.textContent='That’s interesting. Keep going.'}},700)}draw();</script></body></html>
