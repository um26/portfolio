<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — Utkarsh Mangal</title><link rel="icon" href="favicon.ico"><style>:root{--bg:#07090d;--panel:#10141b;--line:#252c37;--text:#f4f7fb;--muted:#9aa5b5;--cyan:#43e6ff;--violet:#9b7cff;--green:#7ef29a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#17223a 0,transparent 32%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.nav{position:sticky;top:0;z-index:10;height:68px;background:#07090de8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font:800 14px monospace;letter-spacing:.14em}.nav a{color:#cbd5e1;text-decoration:none;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:56px 24px 100px}.eyebrow{font:700 10px monospace;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:end}.hero h1{font-size:clamp(48px,8vw,104px);line-height:.88;letter-spacing:-.065em;margin:18px 0}.dek{max-width:720px;font-size:19px;line-height:1.65;color:#b9c3d1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;padding:11px 15px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;background:#111722}.btn.primary{background:var(--text);color:#080a0e;border-color:var(--text)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.panel{border:1px solid var(--line);background:#0d1118cc;border-radius:14px;padding:18px}.stat b{display:block;font-size:25px;margin-bottom:5px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.media{margin:48px 0 24px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a0e14}.media img{display:block;width:100%;max-height:560px;object-fit:cover}.section{margin-top:55px}.section h2{font-size:30px;letter-spacing:-.03em;margin:0 0 18px}.section p{color:#b9c3d1;line-height:1.8;max-width:850px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.panel h3{margin:0 0 10px;font-size:15px}.panel p{font-size:13px;margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:600 10px monospace;padding:8px 10px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:18px;border-top:2px solid var(--cyan);background:#0d1118;border-radius:10px}.step b{font-size:12px}.step p{font-size:12px;margin:8px 0 0}.footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.hero h1{font-size:58px}.stats{margin-top:10px}}@media(max-width:480px){.flow{grid-template-columns:1fr}.wrap{padding-left:16px;padding-right:16px}}</style></head><body><header class="nav"><div class="brand">UM / PROJECT LAB</div><a href="interfaces.html">← Format Lab</a></header><main class="wrap" id="app"></main><script>const projects={unipool:{eyebrow:'PRODUCT / FULL-STACK',title:'UniPool',dek:'A university carpooling platform that turns fragmented travel coordination into structured, route-aware matching.',hero:'shot-unipool-1.png',stats:[['MATCH WINDOW','±1 hour'],['CLIENT','React Native'],['API','FastAPI']],problem:'Students often coordinate travel through scattered WhatsApp groups and informal networks. UniPool turns a travel plan into a structured request, finds compatible travellers and notifies the people who can actually share the ride.',approach:'A mobile-first client sends travel requests to a FastAPI backend. The backend compares origin, destination, time window, user identity and preference constraints, then returns compatible pools and triggers email notifications.',flow:[['01','POST','Create a travel request with route, date, time and preferences.'],['02','MATCH','Compare origin, destination and time within a ±1-hour window.'],['03','NOTIFY','Surface compatible travellers and send notifications.'],['04','COORDINATE','Users connect and coordinate the shared ride.']],stack:['React Native','Expo','TypeScript','FastAPI','Python','MongoDB'],links:[['Live product','https://uni-pool-ruddy.vercel.app/'],['GitHub','https://github.com/um26/UniPool']]},scheme:{eyebrow:'PRODUCT / WEB',title:'Scheme Navigator',dek:'A focused web product for navigating government schemes and finding relevant information without digging through fragmented sources.',stats:[['STATUS','LIVE'],['TYPE','Web app'],['ROLE','Build / Product']],problem:'The project is designed around reducing the friction between a user and the information they are looking for: instead of treating schemes as a static document dump, the interface makes discovery and navigation the primary experience.',approach:'The portfolio intentionally links to the deployed application so the work can be evaluated as a product rather than only as source code. The case-study shell stays conservative about implementation details until the project itself provides a fuller technical specification.',flow:[['01','DISCOVER','Start from the information a user actually needs.'],['02','FILTER','Narrow the available scheme information.'],['03','UNDERSTAND','Present the relevant details clearly.'],['04','ACT','Move from information to the next useful step.']],stack:['Web UI','Search / navigation','Responsive design'],links:[['Live product','https://scheme-navigator-ten.vercel.app/'],['GitHub','https://github.com/um26/scheme-navigator']]},tobs:{eyebrow:'RESEARCH / OPTIMIZATION',title:'TOBS',dek:'Topology Optimization of Binary Structures — exploring binary material layouts through finite-element analysis, sensitivities and sequential integer linear programming.',stats:[['DESIGN','0 / 1'],['METHOD','SILP'],['DOMAIN','FEA']],problem:'Classical density-based topology optimization allows intermediate material densities. TOBS treats each element as strictly solid or void, producing physically interpretable binary layouts while turning each update into a constrained integer optimization problem.',approach:'The workflow starts from a discretized design domain, evaluates the structural response with finite-element analysis, computes sensitivities, formulates a linearized integer subproblem, applies a move limit and repeats until the design stabilizes.',flow:[['01','INITIALIZE','Discretize the domain and assign binary material states.'],['02','ANALYZE','Run FEA and evaluate the current structural response.'],['03','OPTIMIZE','Solve the linearized ILP update under constraints.'],['04','UPDATE','Flip selected elements and iterate toward convergence.']],stack:['Topology optimization','FEA','Sensitivity analysis','Binary variables','ILP / SILP','NGSolve'],links:[['GitHub','https://github.com/um26/tobs']]}};const q=new URLSearchParams(location.search),p=projects[q.get('p')]||projects.unipool;document.title=p.title+' — Utkarsh Mangal';const image=p.hero?`<div class="media"><img src="${p.hero}" alt="${p.title} project preview"></div>`:'';document.querySelector('#app').innerHTML=`<div class="hero"><div><div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><div class="dek">${p.dek}</div><div class="actions">${p.links.map((l,i)=>`<a class="btn ${i?'':'primary'}" href="${l[1]}" target="_blank" rel="noreferrer">${l[0]} ↗</a>`).join('')}</div></div><div class="stats">${p.stats.map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div></div>${image}<section class="section"><h2>The problem</h2><p>${p.problem}</p></section><section class="section"><h2>How I approached it</h2><p>${p.approach}</p></section><section class="section"><h2>System / workflow</h2><div class="flow">${p.flow.map(s=>`<div class="step"><b>${s[0]} · ${s[1]}</b><p>${s[2]}</p></div>`).join('')}</div></section><section class="section grid"><div class="panel"><h3>Technology & methods</h3><div class="chips">${p.stack.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="panel"><h3>Why it belongs here</h3><p>This page is deliberately a case study, not a résumé paragraph. It shows the problem, the technical reasoning and the route to the working artifact.</p></div></section><footer class="footer"><span>UTKARSH MANGAL / PROJECT LAB</span><a href="interfaces.html" style="color:inherit">Back to Format Lab →</a></footer>`;</script></body></html>
