.line{white-space:pre-wrap;word-break:break-word}

let audioCtx=null,soundReady=false;
function ensureAudio(){ if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}} if(audioCtx.state==="suspended")audioCtx.resume(); return audioCtx; }
function playTone(freq,dur,type="square",vol=0.02,delay=0){
  const ctx=ensureAudio();if(!ctx)return;
  const t0=ctx.currentTime+delay;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.02);
}
function sfxKey(){playTone(220+Math.random()*60,.02,"square",.015);}
function sfxBeep(){playTone(880,.08,"sine",.03);}
function sfxError(){playTone(160,.15,"sawtooth",.03);}

function ls(arg){

function cd(arg){

  const target = arg.replace(/^\.\//,"").replace(/\/$/,"");
  if(DIRS["/"+target]){ cwd="/"+target; print(`<span class="dim">→ ${cwd}</span>`); }
  else { print(`<span class="err">cd: no such directory: ${arg}</span>`); sfxError(); }
}

function matrix(){

    print(`<span class="dim">Entering the Matrix. Press any key or type 'matrix' again to exit.</span>`);

    print(`<span class="dim">Back to reality.</span>`);

}

let matrixRAF=null;
function startMatrixRain(){
  const cv=document.getElementById("matrix-cv");
  const ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=Math.floor(cv.width/16);
  const drops=new Array(cols).fill(0);
  const chars="アイウエオカキクケコ01UTKARSHMANGAL$#@%";
  function draw(){
    ctx.fillStyle="rgba(0,0,0,.08)";
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#00ff41";
    ctx.font="14px monospace";
    drops.forEach((y,i)=>{
      const ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(ch, i*16, y*16);
      if(y*16>cv.height && Math.random()>0.975) drops[i]=0;
      else drops[i]=y+1;
    });
    if(matrixOn) matrixRAF=requestAnimationFrame(draw);
  }
  draw();
}
function stopMatrixIfRunning(){
  if(matrixOn){ matrixOn=false; document.getElementById("matrix-cv").classList.remove("on"); }
  if(matrixRAF) cancelAnimationFrame(matrixRAF);
}

function connect(arg){
  if(!arg) return print(`<span class="err">connect: specify a host</span>`);
  const target=arg.toLowerCase().replace(/\.host$/,"");
  if(target==="mainframe") return startHack();
  const host=HOSTS.find(h=>h[1]===target);
  if(!host) return print(`<span class="err">connect: unknown host '${escapeHtml(arg)}'</span>`);
  print(`<span class="cyan">Connecting to ${host[2]}...</span>`);
  sfxBeep();
  setTimeout(()=>{ window.location.href=host[4]; }, 500);
}

// ═══ HACK MINIGAME — deepest easter egg ═══
let hackState=null;
const HACK_CHARS="ABCDEF0123456789";
function randHex(len){
  let s="";
  for(let i=0;i<len;i++) s+=HACK_CHARS[Math.floor(Math.random()*HACK_CHARS.length)];
  return s;
}
function startHack(){
  print(`<span class="err bold">⚠ BREACH PROTOCOL INITIATED ⚠</span>
<span class="dim">Type each code exactly before it expires. 3 rounds.</span>`);
  hackState={round:0,total:3};
  nextHackRound();
}
function nextHackRound(){
  if(!hackState) return;
  hackState.round++;
  if(hackState.round>hackState.total) return finishHack(true);
  const len=4+hackState.round;
  hackState.target=randHex(len);
  print(`<span class="cyan">ROUND ${hackState.round}/${hackState.total}</span>  target code: <span class="white bold">${hackState.target}</span>`);
  clearTimeout(hackState.timeoutId);
  hackState.timeoutId=setTimeout(()=>{ if(hackState) finishHack(false); }, 4500);
}
function finishHack(success){
  if(!hackState) return;
  clearTimeout(hackState.timeoutId);
  hackState=null;
  if(success){
    sfxSuccess();
    print(`<span class="white bold">ACCESS GRANTED — MAINFRAME BREACHED.</span>
<span class="cyan">You found the deepest easter egg. Respect.</span>
<span class="dim">(There's nothing else hidden after this. You can stop looking. Or not.)</span>`);
  } else {
    sfxError();
    print(`<span class="err bold">CONNECTION TERMINATED.</span> <span class="dim">Type 'connect mainframe' to try again.</span>`);
  }
}

const COMMANDS = {
  help, whoami, about:()=>print(FILES["about.txt"]()), skills:()=>FILES["skills.txt"](),
  projects, experience:()=>print(FILES["experience.txt"]()), education, contact:()=>print(FILES["contact.txt"]()),
  resume, matrix, clear:clearScreen, sl,
  history:()=>print(history.length?history.join("\n"):"<span class=\"dim\">(empty)</span>"),
  ls, cd, cat,
  scan, nmap:scan, connect, hack:startHack,
  exit:()=>print(`<span class="err">There is no escape.</span> <span class="dim">(closing the browser tab is allowed though)</span>`),
  echo:(arg)=>print(arg||""),
  date:()=>print(new Date().toString()),
};

function runCommand(raw){
  const trimmed=raw.trim();
  if(hackState){
    print(`<div class="prompt-row"><span class="ps1">guest@utkarsh-mangal:${cwd}$</span> <span class="white">${escapeHtml(trimmed)}</span></div>`);
    if(trimmed.toUpperCase()===hackState.target){
      print(`<span class="cyan">✓ correct</span>`);
      clearTimeout(hackState.timeoutId);
      nextHackRound();
    } else {
      print(`<span class="err">✗ wrong code</span>`);
      finishHack(false);
    }
    return;
  }
  if(!trimmed) return;
  history.push(trimmed);
  histIdx=history.length;
  print(`<div class="prompt-row"><span class="ps1">guest@utkarsh-mangal:${cwd}$</span> <span class="white">${escapeHtml(trimmed)}</span></div>`);

  const parts=trimmed.split(/\s+/);
  const cmd=parts[0].toLowerCase();
  const arg=parts.slice(1).join(" ");

  if(cmd==="sudo" && arg.replace(/-/g,"")==="hireme"){ return sudoHireMe(); }
  if(cmd==="sudo"){ print(`<span class="err">Nice try. This isn't that kind of terminal.</span>`); sfxError(); return; }
  if(cmd==="rm" || cmd==="del"){ print(`<span class="err">Permission denied. (Also, no.)</span>`); sfxError(); return; }

  if(COMMANDS[cmd]){
    COMMANDS[cmd](arg);
  } else {
    print(`<span class="err">command not found: ${escapeHtml(cmd)}</span> <span class="dim">— try 'help'</span>`);
    sfxError();
  }
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ═══ INPUT HANDLING ═══
hiddenInput.addEventListener("keydown",(e)=>{
  if(!booted) return;
  if(matrixOn && e.key!=="Enter"){ matrix(); return; }
  if(e.key==="Enter"){
    e.preventDefault();
    const val=hiddenInput.value;
    hiddenInput.value="";
    typed="";
    typedEl.textContent="";
    runCommand(val);
    return;
  }
  if(e.key==="ArrowUp"){ e.preventDefault(); if(histIdx>0){histIdx--;hiddenInput.value=history[histIdx]||"";typedEl.textContent=hiddenInput.value;} return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); if(histIdx<history.length){histIdx++;hiddenInput.value=history[histIdx]||"";typedEl.textContent=hiddenInput.value;} return; }
  sfxKey();

  // Konami code tracking
  konami.push(e.key);
  if(konami.length>konamiSeq.length) konami.shift();
  if(konami.length===konamiSeq.length && konami.every((k,i)=>k.toLowerCase()===konamiSeq[i].toLowerCase())){
    print(`<span class="cyan bold">🎮 KONAMI CODE ACCEPTED — 30 lives granted (portfolio does not contain lives, this is symbolic)</span>`);
    sfxSuccess();
    konami=[];
  }
});
hiddenInput.addEventListener("input",()=>{ typedEl.textContent=hiddenInput.value; });
