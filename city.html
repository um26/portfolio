//  AUDIO — synthesized, opt-in, off by default (same engine as F1 mode)
// ═══════════════════════════════════════════════════════════════
let audioCtx=null;
let soundOn=localStorage.getItem("gp_sound")==="1";
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
function playTone(freq,dur,type="sine",vol=0.05,delay=0){
  if(!soundOn)return;
  const ctx=ensureAudio();if(!ctx)return;
  const t0=ctx.currentTime+delay;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.02);
}
function sfxEnter(){playTone(520,.09,"sine",.045);playTone(760,.11,"sine",.04,.05);}
function sfxClose(){playTone(480,.08,"sine",.035);playTone(320,.1,"sine",.03,.04);}
function sfxLocked(){playTone(220,.14,"square",.03);playTone(160,.16,"square",.025,.06);}
function sfxClick(){playTone(700,.05,"square",.025);}
function sfxCar(){playTone(180,.22,"sawtooth",.05);playTone(140,.28,"sawtooth",.045,.08);}
function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem("gp_sound",soundOn?"1":"0");
  const btn=document.getElementById("tb-sound");
  btn.textContent=soundOn?"🔊":"🔇";
  btn.setAttribute("aria-pressed",soundOn);
  if(soundOn){ensureAudio();playTone(700,.08,"sine",.05);}
}
window.addEventListener("DOMContentLoaded",()=>{
  if(soundOn){
    const btn=document.getElementById("tb-sound");
    if(btn){btn.textContent="🔊";btn.setAttribute("aria-pressed","true");}
  }
});

function makeLabelSprite(text, sub, color, locked){
  const cv=document.createElement("canvas"); cv.width=512; cv.height=180;
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,512,180);
  ctx.textAlign="center";
  const hex="#"+color.toString(16).padStart(6,"0");
  ctx.font="900 46px Arial";
  ctx.fillStyle=locked?"#999999":hex;
  ctx.shadowColor=hex; ctx.shadowBlur=locked?0:22;
  ctx.fillText(text, 256, 78);
  ctx.shadowBlur=0;
  ctx.font="600 26px Arial";
  ctx.fillStyle=locked?"#666666":"#ffffff";
  ctx.fillText((locked?"🔒 ":"")+sub, 256, 122);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const spr=new THREE.Sprite(mat);
  spr.scale.set(14,5,1);
  return spr;
}

// ─── Window-lit building facade textures (a small reusable palette) ───
const WINDOW_TEX_CACHE = [];
function buildWindowTexturePalette(){
  const baseTones = [[10,10,22],[16,10,26],[8,14,24],[18,8,18]];
  const litColors = ["#ffd27a","#ffe9b0","#8fe9ff","#ff9fce"];
  baseTones.forEach((base,i)=>{
    const cv=document.createElement("canvas"); cv.width=128; cv.height=128;
    const ctx=cv.getContext("2d");
    ctx.fillStyle=`rgb(${base[0]},${base[1]},${base[2]})`;
    ctx.fillRect(0,0,128,128);
    const cols=8, rows=8, cw=128/cols, rh=128/rows;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const lit = Math.random()<0.38;
        ctx.fillStyle = lit ? litColors[(i+c+r)%litColors.length] : "rgba(0,0,0,0.4)";
        const pad=cw*0.2;
        ctx.fillRect(c*cw+pad, r*rh+pad, cw-pad*2, rh-pad*2);
      }
    }
    const tex=new THREE.CanvasTexture(cv);
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
    WINDOW_TEX_CACHE.push(tex);
  });
}

function buildTieredBuilding(w,h,d,windowTex){
  const g=new THREE.Group();
  const repeat = Math.max(1, Math.round(h/6));
  const sideTex = windowTex.clone(); sideTex.needsUpdate=true; sideTex.repeat.set(Math.max(1,Math.round(w/4)), repeat);
  const sideMat=new THREE.MeshLambertMaterial({map:sideTex});
  const roofMat=new THREE.MeshLambertMaterial({color:0x14141c});
  const materials=[sideMat,sideMat,roofMat,roofMat,sideMat,sideMat];
  const base=new THREE.Mesh(new THREE.BoxGeometry(w,h*0.62,d),materials);
  base.position.y=h*0.31; g.add(base);
  const mid=new THREE.Mesh(new THREE.BoxGeometry(w*0.72,h*0.26,d*0.72),materials);
  mid.position.y=h*0.62+h*0.13; g.add(mid);
  const top=new THREE.Mesh(new THREE.BoxGeometry(w*0.4,h*0.12,d*0.4),roofMat);
  top.position.y=h*0.88+h*0.06; g.add(top);
  const antenna=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2.4,6), new THREE.MeshLambertMaterial({color:0x333333}));
  antenna.position.y=h+1.2; g.add(antenna);
  const beacon=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), new THREE.MeshLambertMaterial({color:0xff2200,emissive:0xff2200,emissiveIntensity:1}));
  beacon.position.y=h+2.3; g.add(beacon);
  return g;
}

function buildSimpleBuilding(w,h,d,windowTex,locked){
  const repeat = Math.max(1, Math.round(h/6));
  const sideTex = locked ? null : windowTex.clone();
  let sideMat;
  if(locked){
    sideMat=new THREE.MeshLambertMaterial({color:0x24242e});
  } else {
    sideTex.needsUpdate=true; sideTex.repeat.set(Math.max(1,Math.round(w/4)), repeat);
    sideMat=new THREE.MeshLambertMaterial({map:sideTex});
  }
  const roofMat=new THREE.MeshLambertMaterial({color:0x14141c});
  const materials=[sideMat,sideMat,roofMat,roofMat,sideMat,sideMat];
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),materials);
  mesh.position.y=h/2;
  return mesh;
}

function buildCrosswalk(x,z,horizontal){
  const g=new THREE.Group();
  const mat=new THREE.MeshBasicMaterial({color:0xdedee6});
  for(let i=-3;i<=3;i++){
    const s=new THREE.Mesh(new THREE.PlaneGeometry(horizontal?0.7:5.5, horizontal?5.5:0.7), mat);
    s.rotation.x=-Math.PI/2;
    if(horizontal) s.position.set(x+i*1, 0.015, z);
    else s.position.set(x, 0.015, z+i*1);
    g.add(s);
  }
  return g;
}

function buildMoonAndStars(){
  const g=new THREE.Group();
  const moon=new THREE.Mesh(new THREE.SphereGeometry(9,20,20), new THREE.MeshBasicMaterial({color:0xfff3d6}));
  moon.position.set(-90,110,-220); g.add(moon);

    map:(()=>{
      const cv=document.createElement("canvas"); cv.width=256; cv.height=256;
      const ctx=cv.getContext("2d");
      const grad=ctx.createRadialGradient(128,128,0,128,128,128);
      grad.addColorStop(0,"rgba(255,244,214,0.55)");
      grad.addColorStop(1,"rgba(255,244,214,0)");
      ctx.fillStyle=grad; ctx.fillRect(0,0,256,256);
      return new THREE.CanvasTexture(cv);
    })(),
    transparent:true, depthTest:false
  }));
  glow.scale.set(60,60,1); glow.position.copy(moon.position);
  g.add(glow);

  const count=1400;
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const theta=Math.random()*Math.PI*2, phi=Math.acos(Math.random()*0.5);
    const r=260+Math.random()*80;
    pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=Math.abs(r*Math.cos(phi))+40;
    pos[i*3+2]=r*Math.sin(phi)*Math.sin(theta)-100;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({size:1.1, color:0xffffff, transparent:true, opacity:0.75, depthWrite:false});
  g.add(new THREE.Points(geo,mat));
  return g;
}

function initScene(){
  const canvas=document.getElementById("cv");
  renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x1a0a2e,1);

  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x2a1150, 0.011);

  camera=new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 600);
  camera.position.set(carX - Math.sin(carHeading)*6.2, 3.1, carZ - Math.cos(carHeading)*6.2);
  camera.lookAt(carX, 1.2, carZ);

  const skyGeo=new THREE.SphereGeometry(400,16,16);
  const skyMat=new THREE.ShaderMaterial({
    side:THREE.BackSide,
    vertexShader:`varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vPos; void main(){
      float h=normalize(vPos).y*0.5+0.5;
      vec3 top=vec3(0.05,0.03,0.16);
      vec3 mid=vec3(0.34,0.09,0.34);
      vec3 bot=vec3(0.55,0.22,0.28);
      vec3 col=mix(bot,mid,smoothstep(0.0,0.35,h));
      col=mix(col,top,smoothstep(0.35,0.85,h));
      gl_FragColor=vec4(col,1.0);
    }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  scene.add(buildMoonAndStars());

  scene.add(new THREE.AmbientLight(0x5533aa, 1.0));
  const sun=new THREE.DirectionalLight(0xffaa66, 0.55);
  sun.position.set(-30,40,-20); scene.add(sun);
  const pink=new THREE.PointLight(0xff2e88, 3, 90); pink.position.set(-26,10,0); scene.add(pink);
  const cyan=new THREE.PointLight(0x00f0ff, 3, 90); cyan.position.set(26,10,0); scene.add(cyan);

  buildWindowTexturePalette();

  scene.add(buildSidewalkAndRoad());
  [[0,-8],[0,-52],[0,-95]].forEach(([x,z])=>scene.add(buildCrosswalk(x,z,true)));

  BUILDINGS.forEach((b,i)=>{
    let mesh;
    const tex = WINDOW_TEX_CACHE[i % WINDOW_TEX_CACHE.length];
    if(b.locked){
      mesh=buildSimpleBuilding(b.w,b.h,b.d,tex,true);
    } else if(b.tier){
      mesh=buildTieredBuilding(b.w,b.h,b.d,tex);
    } else {
      mesh=buildSimpleBuilding(b.w,b.h,b.d,tex,false);
    }
    mesh.position.x=b.x; mesh.position.z=b.z;
    scene.add(mesh);

    const edges=new THREE.EdgesGeometry(new THREE.BoxGeometry(b.w,b.h,b.d));
    const line=new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:b.color, transparent:true, opacity:b.locked?0.35:0.85}));
    line.position.set(b.x,b.h/2,b.z);
    scene.add(line);

    const label=makeLabelSprite(b.label, b.sub, b.color, b.locked);
    label.position.set(b.x, b.h+3.4, b.z);
    scene.add(label);
    b._pos=new THREE.Vector3(b.x,0,b.z);
  });

  // Streetlights down both sides of the main street
  for(let z=70; z>-130; z-=22){
    scene.add(buildStreetlight(-15.5,z));
    scene.add(buildStreetlight(15.5,z));
  }

  // Parked cars for street life
  const carColors=[0xff2e88,0x00f0ff,0xffd700,0x7b2ff7,0x00e87a];
  [[-15.6,-18,0],[15.6,-40,Math.PI],[-15.6,55,0],[15.6,-100,Math.PI],[-15.6,-125,0]].forEach(([x,z,h],i)=>{
    scene.add(buildParkedCar(x,z,h,carColors[i%carColors.length]));
  });

  // Palm trees
  [[-40,20],[40,20],[-40,-100],[40,-100],[-14,60],[14,60],[-14,-130],[14,-130]].forEach(([x,z])=>scene.add(buildPalm(x,z)));

  // Player character
  const p=buildPerson();
  person=p.group;
  WALK_PARTS={leftArm:p.leftArmPivot, rightArm:p.rightArmPivot, leftLeg:p.leftLegPivot, rightLeg:p.rightLegPivot};
  scene.add(person);

  window.addEventListener("resize", onResize);
  animate();
}

function buildPalm(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.4,6,6), new THREE.MeshLambertMaterial({color:0x5a3d2b}));
  trunk.position.y=3; trunk.rotation.z=0.06; g.add(trunk);
  const leafMat=new THREE.MeshLambertMaterial({color:0x1fae5e});
  for(let i=0;i<6;i++){
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.5,3.2,5), leafMat);
    leaf.position.set(0,6.2,0);
    leaf.rotation.z=Math.PI/2.3;
    leaf.rotation.y=(i/6)*Math.PI*2;
    g.add(leaf);
  }
  g.position.set(x,0,z);
  return g;
}

function updateCar(){
  const up=KEYS["w"]||KEYS["arrowup"]||KEYS["__up"];
  const down=KEYS["s"]||KEYS["arrowdown"]||KEYS["__down"];
  const left=KEYS["a"]||KEYS["arrowleft"]||KEYS["__left"];
  const right=KEYS["d"]||KEYS["arrowright"]||KEYS["__right"];

  if(up) carSpeed=Math.min(carSpeed+WALK_ACCEL, WALK_SPEED);
  else if(down) carSpeed=Math.max(carSpeed-WALK_ACCEL, -WALK_SPEED*0.6);
  else carSpeed*= (Math.abs(carSpeed)>0.002?WALK_FRICTION:0);

  if(left) carHeading += TURN_RATE*(carSpeed<0?-1:1);
  if(right) carHeading -= TURN_RATE*(carSpeed<0?-1:1);

  carX += Math.sin(carHeading)*carSpeed;
  carZ += Math.cos(carHeading)*carSpeed;
  carX = Math.max(-95, Math.min(95, carX));
  carZ = Math.max(-150, Math.min(115, carZ));

  person.position.set(carX, 0, carZ);
  person.rotation.y = carHeading;

  const moving = Math.abs(carSpeed) > 0.006;
  if(moving) walkPhase += Math.abs(carSpeed)*5.2;
  const swing = moving ? Math.sin(walkPhase)*0.55 : 0;
  const bob = moving ? Math.abs(Math.sin(walkPhase))*0.05 : 0;
  WALK_PARTS.leftArm.rotation.x = swing;
  WALK_PARTS.rightArm.rotation.x = -swing;
  WALK_PARTS.leftLeg.rotation.x = -swing;
  WALK_PARTS.rightLeg.rotation.x = swing;
  person.position.y = bob;

  document.getElementById("spd-wrap").textContent = moving ? (Math.abs(carSpeed)>WALK_SPEED*0.7 ? "🏃 running" : "🚶 walking") : "🧍 standing";

  const camDist=6.2, camHeight=3.1;
  const desiredX = carX - Math.sin(carHeading)*camDist;
  const desiredZ = carZ - Math.cos(carHeading)*camDist;
  camera.position.x += (desiredX-camera.position.x)*0.1;
  camera.position.z += (desiredZ-camera.position.z)*0.1;
  camera.position.y += (camHeight-camera.position.y)*0.1;
  camera.lookAt(carX, 1.2, carZ);

  let closest=null, closestDist=Infinity;
  BUILDINGS.forEach(b=>{
    const dx=carX-b.x, dz=carZ-b.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<closestDist){closestDist=dist;closest=b;}
  });
  const promptEl=document.getElementById("prompt");
  if(closest && closestDist < Math.max(closest.w,closest.d)*0.85){
    nearBuilding=closest;
    promptEl.textContent = closest.locked ? `🔒 ${closest.label} (locked)` : closest.portal ? `Walk in to hop in the car → F1 mode` : `Press E to enter ${closest.label}`;
    promptEl.classList.add("on");
  } else {
    nearBuilding=null;
    promptEl.classList.remove("on");
  }

  drawMinimap();
}

function drawMinimap(){
  const cv=document.getElementById("minimap");
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,132,132);
  ctx.save();
  ctx.beginPath();ctx.arc(66,66,64,0,Math.PI*2);ctx.clip();
  ctx.fillStyle="#0d0a16";ctx.fillRect(0,0,132,132);
  const scale=0.42;
  const toMap=(x,z)=>[66+(x-carX)*scale, 66+(z-carZ)*scale];
  BUILDINGS.forEach(b=>{
    const [mx,my]=toMap(b.x,b.z);
    if(mx<-6||mx>138||my<-6||my>138)return;
    ctx.fillStyle=b.locked?"#555":"#"+b.color.toString(16).padStart(6,"0");
    ctx.beginPath();ctx.arc(mx,my,4,0,Math.PI*2);ctx.fill();
  });
  ctx.save();
  ctx.translate(66,66); ctx.rotate(carHeading);
  ctx.fillStyle="#00f0ff";
  ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,6); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(66,66,64,0,Math.PI*2);ctx.stroke();
}

function animate(){
  requestAnimationFrame(animate);
  updateCar();
  renderer.render(scene, camera);
}

// ═══ Loading sequence ═══
window.addEventListener("load", ()=>{
  const msgs=["PAVING STREETS...","PLANTING PALM TREES...","WIRING NEON SIGNS...","LIGHTING UP WINDOWS...","PARKING CARS ON THE STREET..."];
  let p=0;
  const fill=document.getElementById("ld-fill");
  const msg=document.getElementById("ld-msg");
  const iv=setInterval(()=>{
    p+=8+Math.random()*14;
    if(p>=100){
      p=100; clearInterval(iv);
      fill.style.width="100%";
      setTimeout(()=>{
        document.getElementById("loading").classList.add("away");
        initScene();
      },300);
      return;
    }
    fill.style.width=p+"%";
    msg.textContent=msgs[Math.min(Math.floor(p/22),msgs.length-1)];
  },140);
});
</script>
