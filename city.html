//  AUDIO — synthesized, opt-in, off by default (same engine as F1 mode)
// ═══════════════════════════════════════════════════════════════
let audioCtx=null;
let soundOn=localStorage.getItem("gp_sound")==="1";
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
function playTone(freq,dur,type="sine",vol=0.05,delay=0){
  if(!soundOn)return;
  const ctx=ensureAudio();if(!ctx)return;
  const t0=ctx.currentTime+delay;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.02);
}
function sfxEnter(){playTone(520,.09,"sine",.045);playTone(760,.11,"sine",.04,.05);}
function sfxClose(){playTone(480,.08,"sine",.035);playTone(320,.1,"sine",.03,.04);}
function sfxLocked(){playTone(220,.14,"square",.03);playTone(160,.16,"square",.025,.06);}
function sfxClick(){playTone(700,.05,"square",.025);}
function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem("gp_sound",soundOn?"1":"0");
  const btn=document.getElementById("tb-sound");
  btn.textContent=soundOn?"🔊":"🔇";
  btn.setAttribute("aria-pressed",soundOn);
  if(soundOn){ensureAudio();playTone(700,.08,"sine",.05);}
}
window.addEventListener("DOMContentLoaded",()=>{
  if(soundOn){
    const btn=document.getElementById("tb-sound");
    if(btn){btn.textContent="🔊";btn.setAttribute("aria-pressed","true");}
  }
});

//  THREE.JS SCENE

let renderer, scene, camera, carGrp, WHEELS=[];
const KEYS={};
let carX=0, carZ=40, carHeading=0, carSpeed=0;
const MAX_SPEED=0.62, ACCEL=0.016, TURN_RATE=0.038, FRICTION=0.985, BRAKE_FRICTION=0.9;

const BUILDINGS = [
  {id:"about",    label:"ABOUT ME",        sub:"APARTMENT",   x:-26, z:0,   w:10, h:16, d:10, color:0xff2e88, locked:false},
  {id:"skills",   label:"SKILLS GYM",      sub:"FITNESS",     x:26,  z:0,   w:10, h:12, d:10, color:0x00f0ff, locked:false},
  {id:"projects", label:"PROJECTS GARAGE", sub:"WORKSHOP",    x:-26, z:-70, w:12, h:9,  d:12, color:0xffd700, locked:false},
  {id:"exp",      label:"EXPERIENCE HQ",   sub:"OFFICE",      x:26,  z:-70, w:11, h:20, d:11, color:0x7b2ff7, locked:false},
  {id:"contact",  label:"CONTACT",         sub:"PAYPHONE",    x:0,   z:-115,w:6,  h:7,  d:6,  color:0x00e87a, locked:false},
  {id:"f1",       label:"F1 CIRCUIT",      sub:"RACE TRACK",  x:0,   z:80,  w:14, h:6,  d:14, color:0xe10600, locked:false, portal:true},
  {id:"insta",    label:"INSTAGRAM CLUB",  sub:"COMING SOON", x:-55, z:-35, w:9,  h:11, d:9,  color:0x888888, locked:true},
  {id:"discord",  label:"DISCORD ARCADE",  sub:"COMING SOON", x:55,  z:-35, w:9,  h:11, d:9,  color:0x888888, locked:true},
  {id:"linkedin", label:"LINKEDIN TOWER",  sub:"COMING SOON", x:-55, z:35,  w:9,  h:22, d:9,  color:0x888888, locked:true},
];

function makeLabelSprite(text, sub, color, locked){
  const cv=document.createElement("canvas"); cv.width=512; cv.height=180;
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,512,180);
  ctx.textAlign="center";
  const hex="#"+color.toString(16).padStart(6,"0");
  ctx.font="900 46px Arial";
  ctx.fillStyle=locked?"#999999":hex;
  ctx.shadowColor=hex; ctx.shadowBlur=locked?0:22;
  ctx.fillText(text, 256, 78);
  ctx.shadowBlur=0;
  ctx.font="600 26px Arial";
  ctx.fillStyle=locked?"#666666":"#ffffff";
  ctx.fillText((locked?"🔒 ":"")+sub, 256, 122);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const spr=new THREE.Sprite(mat);
  spr.scale.set(14,5,1);
  return spr;
}

function buildCityCar(){
  const g=new THREE.Group();
  const AM=new THREE.MeshLambertMaterial({color:0x00f0ff});
  const DK=new THREE.MeshLambertMaterial({color:0x0d0d0d});
  const WH=new THREE.MeshLambertMaterial({color:0x0e0e0e});
  const RIM=new THREE.MeshLambertMaterial({color:0xaaaaaa});
  const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m};
  add(new THREE.BoxGeometry(1.8,0.5,4.0),AM,0,0.4,0);
  add(new THREE.BoxGeometry(1.5,0.5,2.0),DK,0,0.85,0.2);
  add(new THREE.BoxGeometry(0.3,0.5,0.5),new THREE.MeshLambertMaterial({color:0xff5533,emissive:0xff2200,emissiveIntensity:0.8}),0,0.4,-2.05);
  [[-0.95,-1.3],[0.95,-1.3],[-0.95,1.3],[0.95,1.3]].forEach(([wx,wz])=>{
    const piv=new THREE.Group();piv.position.set(wx,0.32,wz);
    const t=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.33,0.38,16),WH);t.rotation.z=Math.PI/2;piv.add(t);
    const r=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.4,12),RIM);r.rotation.z=Math.PI/2;piv.add(r);
    g.add(piv);WHEELS.push(piv);
  });
  return g;
}

function buildPalm(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.4,6,6), new THREE.MeshLambertMaterial({color:0x5a3d2b}));
  trunk.position.y=3; trunk.rotation.z=0.06; g.add(trunk);
  const leafMat=new THREE.MeshLambertMaterial({color:0x1fae5e});
  for(let i=0;i<6;i++){
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.5,3.2,5), leafMat);
    leaf.position.set(0,6.2,0);
    leaf.rotation.z=Math.PI/2.3;
    leaf.rotation.y=(i/6)*Math.PI*2;
    g.add(leaf);
  }
  g.position.set(x,0,z);
  return g;
}

function initScene(){
  const canvas=document.getElementById("cv");
  renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x1a0a2e,1);

  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x2a1150, 0.012);

  camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 600);
  camera.position.set(carX - Math.sin(carHeading)*11, 5.5, carZ - Math.cos(carHeading)*11);
  camera.lookAt(carX, 1.4, carZ);

  // Sunset sky gradient (large backdrop plane behind everything)
  const skyGeo=new THREE.SphereGeometry(400,16,16);
  const skyMat=new THREE.ShaderMaterial({
    uniforms:{},
    side:THREE.BackSide,
    vertexShader:`varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vPos; void main(){
      float h=normalize(vPos).y*0.5+0.5;
      vec3 top=vec3(0.10,0.05,0.28);
      vec3 mid=vec3(0.62,0.13,0.45);
      vec3 bot=vec3(1.0,0.45,0.25);
      vec3 col=mix(bot,mid,smoothstep(0.0,0.35,h));
      col=mix(col,top,smoothstep(0.35,0.85,h));
      gl_FragColor=vec4(col,1.0);
    }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // Lighting
  scene.add(new THREE.AmbientLight(0x5533aa, 1.1));
  const sun=new THREE.DirectionalLight(0xffaa66, 0.9);
  sun.position.set(-30,40,-20); scene.add(sun);
  const pink=new THREE.PointLight(0xff2e88, 3, 90); pink.position.set(-26,10,0); scene.add(pink);
  const cyan=new THREE.PointLight(0x00f0ff, 3, 90); cyan.position.set(26,10,0); scene.add(cyan);

  // Ground (asphalt street + sidewalk edges)
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,300), new THREE.MeshLambertMaterial({color:0x1c1a26}));
  ground.rotation.x=-Math.PI/2; scene.add(ground);
  // Lane markings down the main street
  for(let z=90;z>-140;z-=10){
    const dash=new THREE.Mesh(new THREE.PlaneGeometry(0.4,4), new THREE.MeshBasicMaterial({color:0xffe37a}));
    dash.rotation.x=-Math.PI/2; dash.position.set(0,0.02,z); scene.add(dash);
  }

  // Buildings
  BUILDINGS.forEach(b=>{
    const mat=new THREE.MeshLambertMaterial({color:b.locked?0x2a2a34:0x18131f});
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d), mat);
    mesh.position.set(b.x, b.h/2, b.z);
    scene.add(mesh);
    // Neon edge trim
    const edges=new THREE.EdgesGeometry(mesh.geometry);
    const line=new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:b.color, transparent:true, opacity:b.locked?0.35:0.9}));
    line.position.copy(mesh.position);
    scene.add(line);
    // Label sprite above building
    const label=makeLabelSprite(b.label, b.sub, b.color, b.locked);
    label.position.set(b.x, b.h+3.4, b.z);
    scene.add(label);
    b._pos=new THREE.Vector3(b.x,0,b.z);
  });

  // Palm trees scattered around
  [[-40,20],[40,20],[-40,-100],[40,-100],[-14,60],[14,60],[-14,-130],[14,-130]].forEach(([x,z])=>scene.add(buildPalm(x,z)));

  // Player car
  carGrp=buildCityCar();
  scene.add(carGrp);

  window.addEventListener("resize", onResize);
  animate();
}

function onResize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

document.addEventListener("keydown", e=>{

  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();

  btn.addEventListener("touchstart",on);btn.addEventListener("touchend",off);btn.addEventListener("touchcancel",off);

let nearBuilding=null;
function tryEnter(){
  if(!nearBuilding)return;
  if(nearBuilding.locked){
    sfxLocked();
    showToast("🔒 "+nearBuilding.label+" — COMING SOON");
    return;
  }
  if(nearBuilding.portal){
    sfxEnter();
    setTimeout(()=>{window.location.href="index.html";},260);
    return;
  }
  openPanel(nearBuilding.id);
}

function updateCar(){
  const up=KEYS["w"]||KEYS["arrowup"]||KEYS["__up"];
  const down=KEYS["s"]||KEYS["arrowdown"]||KEYS["__down"];
  const left=KEYS["a"]||KEYS["arrowleft"]||KEYS["__left"];
  const right=KEYS["d"]||KEYS["arrowright"]||KEYS["__right"];

  if(up) carSpeed=Math.min(carSpeed+ACCEL, MAX_SPEED);
  else if(down) carSpeed=Math.max(carSpeed-ACCEL, -MAX_SPEED*0.55);
  else carSpeed*= (Math.abs(carSpeed)>0.002?FRICTION:0);
  if(!up&&!down) carSpeed*=BRAKE_FRICTION;

  const turnFactor=Math.min(Math.abs(carSpeed)/(MAX_SPEED*0.5),1);
  if(left) carHeading += TURN_RATE*turnFactor*(carSpeed<0?-1:1);
  if(right) carHeading -= TURN_RATE*turnFactor*(carSpeed<0?-1:1);

  carX += Math.sin(carHeading)*carSpeed;
  carZ += Math.cos(carHeading)*carSpeed;
  carX = Math.max(-95, Math.min(95, carX));
  carZ = Math.max(-150, Math.min(115, carZ));

  carGrp.position.set(carX, 0, carZ);
  carGrp.rotation.y = carHeading;
  WHEELS.forEach(w=>{w.rotation.x += carSpeed*1.4;});

  document.getElementById("spd-v").textContent = Math.round(Math.abs(carSpeed)*180);

  // Camera chase
  const camDist=11, camHeight=5.5;
  const desiredX = carX - Math.sin(carHeading)*camDist;
  const desiredZ = carZ - Math.cos(carHeading)*camDist;
  camera.position.x += (desiredX-camera.position.x)*0.09;
  camera.position.z += (desiredZ-camera.position.z)*0.09;
  camera.position.y += (camHeight-camera.position.y)*0.09;
  camera.lookAt(carX, 1.4, carZ);

  // Proximity check
  let closest=null, closestDist=Infinity;
  BUILDINGS.forEach(b=>{
    const dx=carX-b.x, dz=carZ-b.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<closestDist){closestDist=dist;closest=b;}
  });
  const promptEl=document.getElementById("prompt");
  if(closest && closestDist < Math.max(closest.w,closest.d)*0.85){
    nearBuilding=closest;
    promptEl.textContent = closest.locked ? `🔒 ${closest.label} (locked)` : closest.portal ? `Drive in to launch ${closest.label}` : `Press E to enter ${closest.label}`;
    promptEl.classList.add("on");
  } else {
    nearBuilding=null;
    promptEl.classList.remove("on");
  }

  drawMinimap();
}

function drawMinimap(){
  const cv=document.getElementById("minimap");
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,132,132);
  ctx.save();
  ctx.beginPath();ctx.arc(66,66,64,0,Math.PI*2);ctx.clip();
  ctx.fillStyle="#0d0a16";ctx.fillRect(0,0,132,132);
  const scale=0.42;
  const toMap=(x,z)=>[66+(x-carX)*scale, 66+(z-carZ)*scale];
  BUILDINGS.forEach(b=>{
    const [mx,my]=toMap(b.x,b.z);
    if(mx<-6||mx>138||my<-6||my>138)return;
    ctx.fillStyle=b.locked?"#555":"#"+b.color.toString(16).padStart(6,"0");
    ctx.beginPath();ctx.arc(mx,my,4,0,Math.PI*2);ctx.fill();
  });
  // player arrow at center
  ctx.save();
  ctx.translate(66,66); ctx.rotate(carHeading);
  ctx.fillStyle="#00f0ff";
  ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,6); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(66,66,64,0,Math.PI*2);ctx.stroke();
}

function animate(){
  requestAnimationFrame(animate);
  updateCar();
  renderer.render(scene, camera);
}
