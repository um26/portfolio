<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Utkarsh Mangal — Formula Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --r:#e10600;--g:#00e87a;--t:#00d2be;--y:#ffd700;
  --bg:#020204;--fg:#ffffff;
  --H:'Orbitron',monospace;--M:'Space Mono',monospace;--B:'Barlow',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--B);overflow:hidden;cursor:default}
#cv{position:fixed;inset:0;z-index:0}

/* ═══ LOADING ═══ */
#loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;transition:opacity .8s,visibility .8s}
#loading.done{opacity:0;visibility:hidden}
.ld-logo{font-family:var(--H);font-size:clamp(1rem,3.5vw,1.8rem);font-weight:900;letter-spacing:.12em;color:var(--r);animation:pulse 1.2s infinite alternate}
.ld-bar-wrap{width:clamp(200px,35vw,320px);height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden}
.ld-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--r),var(--t));border-radius:1px;transition:width .15s}
.ld-txt{font-family:var(--M);font-size:.62rem;color:#333;letter-spacing:.2em}
@keyframes pulse{from{opacity:.5}to{opacity:1}}

/* ═══ HEADER ═══ */
#hdr{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;padding:0 clamp(1rem,3vw,2.4rem);gap:1.2rem;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(2,2,4,.7);backdrop-filter:blur(20px);transform:translateY(-60px);transition:transform .7s cubic-bezier(.16,1,.3,1)}
#hdr.in{transform:translateY(0)}
.hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--r);box-shadow:0 0 8px var(--r);animation:pulse 1.4s infinite alternate;flex-shrink:0}
.hdr-name{font-family:var(--H);font-size:clamp(.5rem,1.3vw,.72rem);font-weight:700;letter-spacing:.16em;color:#fff}
.hdr-title{font-family:var(--M);font-size:clamp(.38rem,1vw,.54rem);color:#333;letter-spacing:.12em;font-style:italic}
.hdr-nav{margin-left:auto;display:flex;gap:clamp(.3rem,.8vw,.6rem);align-items:center}
.nav-pill{font-family:var(--H);font-size:clamp(.3rem,.65vw,.42rem);letter-spacing:.12em;padding:.26rem .7rem;border-radius:3px;border:1px solid rgba(255,255,255,.06);color:#333;cursor:pointer;transition:all .2s;background:none;white-space:nowrap}
.nav-pill:hover,.nav-pill.active{border-color:var(--r);color:var(--r);background:rgba(225,6,0,.08);box-shadow:0 0 12px rgba(225,6,0,.12)}
.nav-pill.games-pill{border-color:rgba(0,210,190,.25);color:var(--t)}
.nav-pill.games-pill:hover{background:rgba(0,210,190,.08);box-shadow:0 0 12px rgba(0,210,190,.12)}

/* ═══ HUD CORNERS ═══ */
.corner{position:fixed;z-index:15;width:60px;height:60px;opacity:0;transition:opacity 1s .8s}
.corner.in{opacity:1}
.corner svg{position:absolute}
#c-tl{top:58px;left:0}.c-tl-line{stroke:var(--r);stroke-width:1.5;fill:none}
#c-tr{top:58px;right:0}
#c-bl{bottom:0;left:0}
#c-br{bottom:0;right:0}

/* ═══ CENTER HUD ═══ */
#center-hud{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s}
#center-hud.in{opacity:1}
.ch-name{font-family:var(--H);font-size:clamp(2rem,6vw,5.5rem);font-weight:900;letter-spacing:.08em;text-align:center;line-height:.95;pointer-events:none;user-select:none}
.ch-name .line1{display:block;background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.35));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:slide-in .9s .3s cubic-bezier(.16,1,.3,1) both}
.ch-name .line2{display:block;background:linear-gradient(135deg,var(--r) 0%,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:slide-in .9s .45s cubic-bezier(.16,1,.3,1) both}
.ch-sub{font-family:var(--M);font-size:clamp(.52rem,1.3vw,.78rem);color:rgba(255,255,255,.25);letter-spacing:.22em;margin-top:.7rem;text-align:center;animation:fade-up .9s .65s ease both}
.ch-scroll{font-family:var(--H);font-size:.36rem;letter-spacing:.3em;color:rgba(255,255,255,.15);margin-top:2.5rem;animation:blink 2.5s infinite 1.5s}
.ch-line{width:1px;height:40px;background:linear-gradient(to bottom,rgba(255,255,255,.12),transparent);margin:.4rem auto;animation:fade-up .9s .9s ease both}

@keyframes slide-in{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:.1}50%{opacity:.55}}

/* ═══ SECTION BUTTONS (floating around center) ═══ */
#orbs{position:fixed;inset:0;z-index:6;pointer-events:none}
.orb-btn{position:absolute;transform:translate(-50%,-50%);pointer-events:all;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.35rem;opacity:0;transition:opacity .6s,transform .3s}
.orb-btn.in{opacity:1}
.orb-btn:hover .orb-ring{transform:scale(1.18);box-shadow:0 0 24px var(--oc),0 0 48px rgba(var(--ocr),.25)}
.orb-btn:hover .orb-label{color:#fff;opacity:1}
.orb-ring{width:clamp(48px,6vw,70px);height:clamp(48px,6vw,70px);border-radius:50%;border:1.5px solid var(--oc);background:rgba(var(--ocr),.06);display:flex;align-items:center;justify-content:center;font-size:clamp(1.1rem,2.5vw,1.6rem);transition:all .28s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px rgba(var(--ocr),.15);backdrop-filter:blur(8px)}
.orb-ring.active-orb{background:rgba(var(--ocr),.18);box-shadow:0 0 28px var(--oc),0 0 60px rgba(var(--ocr),.2)}
.orb-label{font-family:var(--H);font-size:clamp(.3rem,.7vw,.44rem);letter-spacing:.2em;color:rgba(255,255,255,.35);opacity:.7;transition:all .22s;text-align:center;white-space:nowrap}

/* ═══ CONTENT PANEL ═══ */
#panel-wrap{position:fixed;inset:52px 0 0 0;z-index:25;display:flex;align-items:center;justify-content:flex-end;padding:clamp(1rem,2.5vw,1.8rem);pointer-events:none}
#content-panel{width:min(480px,90vw);max-height:calc(100vh - 100px);background:rgba(2,2,4,.88);border:1px solid rgba(255,255,255,.08);border-radius:16px;backdrop-filter:blur(40px);transform:translateX(calc(100% + 2rem));opacity:0;transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .55s;overflow:hidden;pointer-events:none;position:relative}
#content-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--pc,var(--r)),transparent);opacity:.7}
#content-panel.open{transform:translateX(0);opacity:1;pointer-events:all}
.panel-scroll{overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 120px);padding:clamp(1.2rem,3vw,1.8rem)}
.panel-scroll::-webkit-scrollbar{width:3px}
.panel-scroll::-webkit-scrollbar-track{background:transparent}
.panel-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.p-close{position:absolute;top:.75rem;right:.75rem;width:24px;height:24px;border-radius:4px;border:1px solid rgba(255,255,255,.08);background:none;color:#333;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;transition:all .16s;z-index:2}
.p-close:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.p-tag{font-family:var(--H);font-size:.38rem;letter-spacing:.32em;color:var(--pc,var(--r));margin-bottom:.3rem}
.p-title{font-family:var(--H);font-size:clamp(.9rem,2.5vw,1.25rem);font-weight:700;margin-bottom:.9rem;line-height:1.2}
/* About section */
.about-hero{display:flex;gap:1rem;align-items:flex-start;margin-bottom:1.2rem}
.about-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--r),#ff6600);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;border:2px solid rgba(225,6,0,.3)}
.about-info{flex:1}
.ai-name{font-family:var(--H);font-size:.78rem;font-weight:700;margin-bottom:.18rem}
.ai-role{font-size:.78rem;color:#555;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.9rem 0}
.stat-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:.6rem .75rem}
.stat-v{font-family:var(--H);font-size:clamp(.9rem,2.5vw,1.2rem);font-weight:700;color:var(--r)}
.stat-l{font-size:.64rem;color:#3a3a3a;letter-spacing:.1em;margin-top:.1rem}
.links-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem}
.link-btn{font-family:var(--H);font-size:.38rem;letter-spacing:.1em;padding:.3rem .8rem;border-radius:4px;border:1px solid rgba(255,255,255,.09);color:#888;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;transition:all .18s}
.link-btn:hover{background:var(--r);border-color:var(--r);color:#fff}
/* Skills */
.skill-category{margin-bottom:1rem}
.skill-cat-label{font-family:var(--H);font-size:.38rem;letter-spacing:.22em;color:#2a2a2a;margin-bottom:.5rem}
.skill-item{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.skill-name{font-family:var(--M);font-size:.62rem;color:#666;width:80px;flex-shrink:0}
.skill-track{flex:1;height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.skill-fill{height:100%;border-radius:2px;transform-origin:left;transform:scaleX(0);transition:transform .8s cubic-bezier(.16,1,.3,1)}
.skill-pct{font-family:var(--M);font-size:.5rem;color:#333;width:28px;text-align:right}
.course-chips{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.7rem}
.cchip{font-size:.58rem;padding:.14rem .48rem;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#3a3a3a;font-family:var(--M)}
/* Experience */
.exp-timeline{position:relative;padding-left:1.2rem}
.exp-timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--r),rgba(225,6,0,.1))}
.exp-item{position:relative;margin-bottom:1.4rem;padding-left:.9rem}
.exp-item::before{content:'';position:absolute;left:-1.25rem;top:.35rem;width:7px;height:7px;border-radius:50%;background:var(--r);box-shadow:0 0 8px var(--r)}
.exp-date{font-family:var(--M);font-size:.52rem;color:#333;letter-spacing:.1em;margin-bottom:.18rem}
.exp-role{font-family:var(--H);font-size:.72rem;font-weight:700;margin-bottom:.12rem}
.exp-co{font-size:.72rem;color:var(--r);margin-bottom:.4rem}
.exp-body{font-size:.78rem;color:#555;line-height:1.65}
.exp-chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.55rem}
.exp-chip{font-size:.54rem;padding:.12rem .42rem;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#3a3a3a}
/* Projects */
.proj-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:1rem;margin-bottom:.75rem;transition:border-color .2s,box-shadow .2s;cursor:pointer}
.proj-card:hover{border-color:rgba(225,6,0,.25);box-shadow:0 4px 24px rgba(225,6,0,.08)}
.proj-icon{font-size:1.4rem;margin-bottom:.4rem}
.proj-name{font-family:var(--H);font-size:.7rem;font-weight:700;margin-bottom:.3rem}
.proj-desc{font-size:.76rem;color:#555;line-height:1.6;margin-bottom:.5rem}
.proj-chips{display:flex;flex-wrap:wrap;gap:.22rem}
.proj-chip{font-size:.52rem;padding:.1rem .38rem;border-radius:3px;background:rgba(225,6,0,.08);border:1px solid rgba(225,6,0,.18);color:rgba(225,6,0,.7)}
/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.contact-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:.75rem;text-decoration:none;display:flex;flex-direction:column;gap:.2rem;transition:all .2s}
.contact-item:hover{border-color:var(--t);background:rgba(0,210,190,.05)}
.ci-ico{font-size:1.2rem}
.ci-lbl{font-family:var(--H);font-size:.38rem;letter-spacing:.16em;color:#2a2a2a}
.ci-val{font-size:.72rem;color:#777;word-break:break-all}
.contact-note{font-size:.76rem;color:#333;line-height:1.65;text-align:center;padding:.75rem;border:1px solid rgba(0,210,190,.12);border-radius:8px;background:rgba(0,210,190,.04)}
/* Education */
.edu-card{background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.1);border-radius:9px;padding:1rem;margin-bottom:.7rem}
.edu-school{font-family:var(--H);font-size:.72rem;font-weight:700;color:var(--y);margin-bottom:.18rem}
.edu-deg{font-size:.76rem;color:#888;margin-bottom:.3rem}
.edu-meta{font-family:var(--M);font-size:.56rem;color:#3a3a3a;line-height:1.8}
.edu-badge{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.18);border-radius:4px;padding:.16rem .52rem;font-family:var(--H);font-size:.38rem;letter-spacing:.1em;color:var(--y);margin-top:.5rem}

/* ═══ STATUS BAR ═══ */
#status{position:fixed;bottom:0;left:0;right:0;height:28px;z-index:20;background:rgba(2,2,4,.7);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.04);display:flex;align-items:center;padding:0 clamp(.8rem,2vw,1.6rem);gap:1.4rem;transform:translateY(32px);transition:transform .7s 1s cubic-bezier(.16,1,.3,1)}
#status.in{transform:translateY(0)}
.st-item{font-family:var(--M);font-size:.44rem;color:#252525;letter-spacing:.1em;display:flex;align-items:center;gap:.35rem}
.st-dot{width:4px;height:4px;border-radius:50%}
.st-dot.green{background:var(--g);box-shadow:0 0 6px var(--g)}
.st-dot.red{background:var(--r);box-shadow:0 0 6px var(--r)}
.st-dot.teal{background:var(--t);box-shadow:0 0 6px var(--t)}
#st-time{margin-left:auto;font-family:var(--M);font-size:.44rem;color:#222;letter-spacing:.12em}
#st-fps{font-family:var(--M);font-size:.44rem;color:#1c1c1c;letter-spacing:.1em}

/* ═══ SCAN LINE EFFECT ═══ */
#scanlines{position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0px,rgba(0,0,0,.035) 1px,transparent 1px,transparent 2px);animation:scanmove 8s linear infinite}
@keyframes scanmove{from{background-position:0 0}to{background-position:0 100vh}}

/* ═══ VIGNETTE ═══ */
#vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 40%,rgba(0,0,0,.65) 100%)}

/* Mobile */
@media(max-width:600px){
  .hdr-title,.nav-pill:not(.games-pill){display:none}
  #panel-wrap{justify-content:center;padding:.5rem}
  #content-panel{width:95vw}
  .orb-ring{width:42px;height:42px;font-size:.95rem}
  .orb-label{font-size:.28rem}
  .contact-grid{grid-template-columns:1fr}
}
</style>
</head>

<!-- LOADING -->
<div id="loading">
  <div class="ld-logo">INITIALIZING RACE SYSTEM</div>

<!-- CANVAS -->

<!-- HEADER -->

<!-- CENTER HUD -->

<script>
"use strict";

// ══════════════════════════════════════════════════════
// CONTENT DATA
// ══════════════════════════════════════════════════════
const SECTIONS = {
  about: {
    color: "#e10600", colorRGB: "225,6,0", icon: "👤", label: "ABOUT ME",
    html: () => `
      <div class="p-tag">DRIVER PROFILE</div>
      <div class="p-title">Utkarsh Mangal</div>
      <div class="about-hero">
        <div class="about-avatar">🏎</div>
        <div class="about-info">
          <div class="ai-name">Utkarsh Mangal</div>
          <div class="ai-role">B.Tech Computational Mathematics<br>Mahindra University, Hyderabad</div>
        </div>
      </div>
      <div style="font-family:var(--B);font-size:.8rem;color:#555;line-height:1.7;margin-bottom:.9rem">
        Currently on <strong style="color:#aaa">Semester Exchange at CentraleSupélec, Paris</strong> — one of France's elite Grandes Écoles and a founding member of Université Paris-Saclay. Passionate about computational problem-solving, optimization theory, and building systems that matter at scale.
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-v">9.83</div><div class="stat-l">CGPA · SEM 7</div></div>
        <div class="stat-box"><div class="stat-v">8.3</div><div class="stat-l">OVERALL CGPA</div></div>
        <div class="stat-box"><div class="stat-v">2022</div><div class="stat-l">MERIT SCHOLAR</div></div>
        <div class="stat-box"><div class="stat-v">350+</div><div class="stat-l">EVENT PARTICIPANTS</div></div>
      </div>
      <div class="links-row">
        <a href="https://www.linkedin.com/in/utkarsh-mangal" target="_blank" class="link-btn">💼 LinkedIn</a>
        <a href="https://github.com/um26" target="_blank" class="link-btn">🐙 GitHub</a>
        <a href="mailto:umangal2003@gmail.com" class="link-btn">📧 Email</a>
        <a href="tel:+919784871049" class="link-btn">📞 Call</a>
        <a href="games.html" class="link-btn" style="border-color:rgba(0,210,190,.25);color:var(--t)">🎮 Play Games</a>
      </div>`
  },
  skills: {
    color: "#00d2be", colorRGB: "0,210,190", icon: "⚡", label: "SKILLS",
    html: () => `
      <div class="p-tag">TECHNICAL ARSENAL</div>
      <div class="p-title">Skills & Stack</div>
      <div class="skill-category">

function buildStarField() {
  const count = 3000;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 80 + Math.random() * 200;
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
    const t = Math.random();
    if (t < 0.1) { colors[i*3]=1; colors[i*3+1]=.15; colors[i*3+2]=.05; } // red stars
    else if (t < 0.18) { colors[i*3]=.05; colors[i*3+1]=.85; colors[i*3+2]=.75; } // teal
    else { const b=.4+Math.random()*.6; colors[i*3]=b; colors[i*3+1]=b; colors[i*3+2]=b; }
    sizes[i] = Math.random() < 0.05 ? 2.5 : 0.8 + Math.random() * 1.2;
  }
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.setAttribute("size", new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      uniform float time;
      void main(){
        vColor=color;
        vec4 mvPos=modelViewMatrix*vec4(position,1.);
        gl_PointSize=size*(200./-mvPos.z)*(0.85+0.15*sin(time*2.+position.x));
        gl_Position=projectionMatrix*mvPos;
      }`,
    fragmentShader: `
      varying vec3 vColor;
      void main(){
        float d=length(gl_PointCoord-.5)*2.;
        if(d>1.)discard;
        float alpha=1.-smoothstep(.6,1.,d);
        gl_FragColor=vec4(vColor,alpha);
      }`,
    transparent: true, vertexColors: true, depthWrite: false
  });
  starField = new THREE.Points(geo, mat);
  scene.add(starField);
}

}

function buildF1Car() {
  const g = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xe10600 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x0d0d0d });
  const teal = new THREE.MeshLambertMaterial({ color: 0x00d2be });
  const wht = new THREE.MeshLambertMaterial({ color: 0xeeeeee });

  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); g.add(m); return m; };
  // Body
  add(new THREE.BoxGeometry(1.4, 0.36, 3.5), red, 0, 0.26, 0);
  add(new THREE.BoxGeometry(0.44, 0.18, 1.0), red, 0, 0.14, -2.2);
  add(new THREE.BoxGeometry(0.6, 0.28, 0.95), dark, 0, 0.5, 0.2);
  // Front/rear wings
  add(new THREE.BoxGeometry(1.9, 0.045, 0.5), teal, 0, 0.05, -2.35);
  add(new THREE.BoxGeometry(1.45, 0.055, 0.38), teal, 0, 0.9, 1.62);
  // Sidepods
  [-1,1].forEach(s => add(new THREE.BoxGeometry(0.38, 0.27, 1.7), red, s*0.76, 0.14, 0.08));
  // Wheels
  [[-0.88,-1.35],[0.88,-1.35],[-0.88,1.3],[0.88,1.3]].forEach(([wx,wz]) => {
    const piv = new THREE.Group();
    piv.position.set(wx, 0.24, wz);
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.3, 16), dark);
    t.rotation.z = Math.PI / 2;
    piv.add(t);
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.32, 12), wht);
    r.rotation.z = Math.PI / 2;
    piv.add(r);
    g.add(piv);
    WHEELS_3D.push(piv);
  });
  // Halo
  const hs = new THREE.Shape();
  hs.absarc(0, 0, 0.46, 0, Math.PI, false);
  const halo = new THREE.Mesh(new THREE.ShapeGeometry(hs, 10), dark);
  halo.position.set(0, 0.55, 0.1);
  halo.rotation.x = -Math.PI / 2;
  g.add(halo);

  g.scale.setScalar(0.7);
  f1Car = g;
  scene.add(f1Car);
}

function buildParticleSystem() {
  // Floating particles around center
  const count = 500;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 3 + Math.random() * 10;
    const height = (Math.random() - 0.5) * 12;
    pos[i*3] = Math.cos(angle) * dist;
    pos[i*3+1] = height;
    pos[i*3+2] = Math.sin(angle) * dist;
    if (Math.random() < 0.3) { col[i*3]=0.88; col[i*3+1]=0.02; col[i*3+2]=0; }
    else if (Math.random() < 0.5) { col[i*3]=0; col[i*3+1]=0.82; col[i*3+2]=0.75; }
    else { col[i*3]=0.3; col[i*3+1]=0.3; col[i*3+2]=0.3; }
  }
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false });
  particleSystem = new THREE.Points(geo, mat);
  scene.add(particleSystem);
}

function buildCentralCore() {
  // Glowing central sphere
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xe10600, transparent: true, opacity: 0.06 });
  const coreGeo = new THREE.SphereGeometry(2, 32, 32);
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);
  // Inner wireframe
  const wfGeo = new THREE.IcosahedronGeometry(1.6, 1);
  const wfMat = new THREE.MeshBasicMaterial({ color: 0xe10600, wireframe: true, transparent: true, opacity: 0.15 });
  const wf = new THREE.Mesh(wfGeo, wfMat);
  scene.add(wf);

  // Three holographic hexagon rings
  for (let ri = 0; ri < 3; ri++) {
    const r = 4 + ri * 2;
    const segments = 6;
    const pts = [];
    for (let i = 0; i <= segments; i++) {
      const a = (i / segments) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
    const hexGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const hexMat = new THREE.LineBasicMaterial({ color: ri === 0 ? 0xe10600 : ri === 1 ? 0x00d2be : 0xffd700, transparent: true, opacity: 0.22 - ri * 0.05 });
    const hex = new THREE.Line(hexGeo, hexMat);
    hex.rotation.y = ri * Math.PI / 6;
    scene.add(hex);
  }
}

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;
  frameCount++;

  // FPS counter
  fpsTimer += 0.008;
  if (fpsTimer > 0.5) {
    lastFPS = Math.round(frameCount / fpsTimer * 2);
    document.getElementById("st-fps").textContent = lastFPS + " FPS";
    frameCount = 0; fpsTimer = 0;
  }

  // Stars twinkle & slow rotation
  if (starField) {
    starField.material.uniforms.time.value = t;
    starField.rotation.y = t * 0.015;
  }

  // Orbit rings counter-rotate
  if (orbitRing1) orbitRing1.rotation.z = t * 0.22;
  if (orbitRing2) orbitRing2.rotation.z = -t * 0.15;

  // F1 car laps the track ring
  if (f1Car) {
    const carAngle = -t * 0.55;
    const carR = 18;
    f1Car.position.x = Math.cos(carAngle) * carR;
    f1Car.position.y = -4 + 0.62;
    f1Car.position.z = Math.sin(carAngle) * carR;
    f1Car.rotation.y = carAngle + Math.PI / 2;
    WHEELS_3D.forEach(w => { w.rotation.x -= 0.22; });
    // Headlight glow pulse
  }

  // Particles orbit + drift
  if (particleSystem) {
    particleSystem.rotation.y = t * 0.06;
    particleSystem.rotation.x = Math.sin(t * 0.12) * 0.08;
  }

  // Camera parallax from mouse
  targetCamX += (mousX * 3.5 - targetCamX) * 0.04;
  targetCamY += (-mousY * 2.5 - targetCamY) * 0.04;
  camera.position.x = targetCamX;
  camera.position.y = 8 + targetCamY;
  camera.position.z = 32;
  camera.lookAt(targetCamX * 0.2, targetCamY * 0.2, 0);

  // Clock in status bar
  const now = new Date();
  document.getElementById("st-time").textContent = now.toLocaleTimeString("en-GB", {hour12:false}) + " UTC+1";

  renderer.render(scene, camera);
}

// ══════════════════════════════════════════════════════
// ORB BUTTONS
// ══════════════════════════════════════════════════════
function buildOrbs() {
  const container = document.getElementById("orbs");
  ORB_POSITIONS.forEach(({ section, x, y }) => {
    const s = SECTIONS[section];
    const btn = document.createElement("button");
    btn.className = "orb-btn";
    btn.id = "orb-" + section;
    btn.style.left = x + "%";
    btn.style.top = y + "%";
    btn.style.setProperty("--oc", s.color);
    btn.style.setProperty("--ocr", s.colorRGB);
    btn.innerHTML = `<div class="orb-ring" id="orbring-${section}">${s.icon}</div><div class="orb-label">${s.label}</div>`;
    btn.onclick = () => openSection(section);
    // Stagger in
    setTimeout(() => btn.classList.add("in"), 400 + ORB_POSITIONS.indexOf(ORB_POSITIONS.find(p=>p.section===section)) * 80);
    container.appendChild(btn);
  });
}

function positionOrbs() {
  ORB_POSITIONS.forEach(({ section, x, y }) => {
    const btn = document.getElementById("orb-" + section);
    if (btn) { btn.style.left = x + "%"; btn.style.top = y + "%"; }
  });
}

// ══════════════════════════════════════════════════════
// PANEL / SECTION LOGIC
// ══════════════════════════════════════════════════════
let activeSection = null;

function openSection(id) {
  const s = SECTIONS[id];
  if (!s) return;
  // Update active orb
  document.querySelectorAll(".orb-ring").forEach(r => r.classList.remove("active-orb"));
  document.querySelectorAll(".nav-pill").forEach(p => p.classList.remove("active"));
  const orbRing = document.getElementById("orbring-" + id);
  if (orbRing) orbRing.classList.add("active-orb");

  // Panel color
  const panel = document.getElementById("content-panel");
  panel.style.setProperty("--pc", s.color);
  // Content
  document.getElementById("panel-body").innerHTML = s.html();
  panel.classList.add("open");
  activeSection = id;

  // Animate skill bars if skills section
  if (id === "skills") {
    requestAnimationFrame(() => {
      document.querySelectorAll(".skill-fill").forEach(el => {
        setTimeout(() => el.style.transform = "scaleX(1)", 100);
      });
    });
  }
}

function closePanel() {
  document.getElementById("content-panel").classList.remove("open");
  document.querySelectorAll(".orb-ring").forEach(r => r.classList.remove("active-orb"));
  activeSection = null;
}

// ══════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════
window.addEventListener("DOMContentLoaded", () => {
  initThree();
  buildOrbs();
  animate();

  // Finish loading after a beat
  setTimeout(() => {
    document.getElementById("loading").classList.add("done");
    document.getElementById("hdr").classList.add("in");
    document.getElementById("center-hud").classList.add("in");
    document.getElementById("status").classList.add("in");
  }, 1800);
});

window.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
</script>
